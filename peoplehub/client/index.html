<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Запрет кэширования HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>PeopleHub</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3B82F6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Telegram WebApp SDK — сразу ready/expand, до React (иначе пустой экран в WebView) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (tg) {
            tg.ready();
            tg.expand();
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="background-color:#f4f4f5;min-height:100vh;margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- SW отключён для Mini App: кэш старых chunk'ов даёт белый экран до ручного обновления -->
  </body>
</html>
