# Автодеплой: классический Hosting (web.app) + rollout App Hosting (*.hosted.app).
# Backend ID смотрите в Firebase Console → App Hosting (в URL вида …/backends/BACKEND_ID).
name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Встраивается в клиент — ограничьте ключ по HTTP referrer в Google AI Studio.
          NEXT_PUBLIC_GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting
        run: firebase deploy --only hosting --project studio-4612461108-2107c --non-interactive

      # Сборка и выкладка на hosted.app идут в Cloud Build из репозитория, привязанного к backend в консоли.
      # Сервис-аккаунту из FIREBASE_SERVICE_ACCOUNT нужны права на App Hosting (например роли вокруг apphosting / firebaseapphosting).
      - name: App Hosting rollout (hosted.app)
        run: firebase apphosting:rollouts:create kiraai --project studio-4612461108-2107c --git-commit ${{ github.sha }} --force --non-interactive
