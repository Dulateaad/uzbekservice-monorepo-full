<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anama">
  <meta name="theme-color" content="#2E7D6B">
  <meta name="application-name" content="Anama">

  <!-- Open Graph без длинного описания — короче превью в мессенджерах -->
  <meta property="og:title" content="Anama">
  <meta property="og:site_name" content="Anama">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://anama-app.web.app/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Anama">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Anama</title>
  <link rel="manifest" href="manifest.json">

  <script>
    var serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>

  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1d5c52 0%, #2E7D6B 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #loading .brand {
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    #loading .sub {
      color: rgba(255, 255, 255, 0.92);
      margin-top: 14px;
      font-size: 16px;
      font-weight: 500;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin-top: 22px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #flutter-container { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="brand">Anama</div>
    <div class="sub">Загрузка…</div>
    <div class="spinner"></div>
  </div>
  <div id="flutter-container"></div>

  <script>
    window.addEventListener('load', function () {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            var loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
