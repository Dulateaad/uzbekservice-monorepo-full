  <script>
    // Подавляем ошибки от расширений браузера
    (function() {
      'use strict';
      
      const originalConsoleError = console.error;
      console.error = function(...args) {
        const message = args.join(' ');
        // Подавляем ошибки от расширений браузера
        if (message.includes('share-modal') || 
            message.includes('chrome-extension://') ||
            message.includes('moz-extension://') ||
            message.includes('Cannot read properties of null')) {
          return;
        }
        originalConsoleError.apply(console, args);
      };
      
      window.onerror = function(message, source) {
        const messageStr = String(message || '');
        const sourceStr = String(source || '');
        
        if (messageStr.includes('share-modal') || 
            sourceStr.includes('chrome-extension://') ||
            sourceStr.includes('moz-extension://')) {
          return true;
        }
        return false;
      };
    })();
  </script>

  <script>
    // Cloudflare Turnstile глобальные функции
    window.turnstileToken = null;
    window.turnstileWidgetId = null;
    
    // Функция для рендеринга Turnstile виджета
    window.renderTurnstile = function(containerId, siteKey, callback) {
      if (typeof turnstile === 'undefined') {
        console.log('⏳ Turnstile еще загружается...');
        setTimeout(() => window.renderTurnstile(containerId, siteKey, callback), 500);
        return;
      }
      
      const container = document.getElementById(containerId);
      if (!container) {
        console.error('❌ Контейнер не найден:', containerId);
        return;
      }
      
      // Удаляем предыдущий виджет если есть
      if (window.turnstileWidgetId) {
        try {
          turnstile.remove(window.turnstileWidgetId);
        } catch (e) {}
      }
      
      console.log('🔄 Рендеринг Cloudflare Turnstile...');
      
      window.turnstileWidgetId = turnstile.render(container, {
        sitekey: siteKey,
        theme: 'light',
        language: 'ru',
        callback: function(token) {
          console.log('✅ Turnstile верификация успешна');
          window.turnstileToken = token;
          if (callback) callback(token);
        },
        'error-callback': function() {
          console.error('❌ Ошибка Turnstile');
          window.turnstileToken = null;
        },
        'expired-callback': function() {
          console.log('⚠️ Turnstile токен истек');
          window.turnstileToken = null;
        }
      });
    };
    
    // Функция для получения токена
    window.getTurnstileToken = function() {
      return window.turnstileToken;
    };
    
    // Функция для сброса виджета
    window.resetTurnstile = function() {
      if (window.turnstileWidgetId && typeof turnstile !== 'undefined') {
        turnstile.reset(window.turnstileWidgetId);
        window.turnstileToken = null;
      }
    };
  </script>

  <!-- Google Maps JavaScript API - Simplified Loading -->
  <script>
    // Глобальная переменная для отслеживания состояния загрузки
    window.googleMapsReady = false;
    window.googleMapsLoading = false;
    window.googleMapsCallbacks = [];
    
    // Простая функция для загрузки Google Maps API
    window.loadGoogleMapsAPI = function(onSuccess, onError) {
      // Если уже загружен
      if (window.google && window.google.maps) {
        console.log('✅ Google Maps API уже загружен');
        window.googleMapsReady = true;
        if (onSuccess) onSuccess();
        return;
      }
      
      // Если уже загружается, добавляем в очередь
      if (window.googleMapsLoading) {
        console.log('⏳ Google Maps API загружается, добавляем в очередь...');
        window.googleMapsCallbacks.push({ onSuccess, onError });
        return;
      }
      
      // Начинаем загрузку
      window.googleMapsLoading = true;
      console.log('🔄 Начинаем загрузку Google Maps API...');
      
      const script = document.createElement('script');
      script.async = true;
      script.defer = true;
      // Добавляем loading=async для оптимизации (убирает предупреждение)
      script.setAttribute('loading', 'async');
      // Используем callback для гарантированной загрузки
      const callbackName = 'initGoogleMaps_' + Date.now();
      window[callbackName] = function() {
        console.log('✅ Google Maps API загружен и инициализирован');
        window.googleMapsReady = true;
        window.googleMapsLoading = false;
        
        // Вызываем все колбэки
        if (onSuccess) onSuccess();
        window.googleMapsCallbacks.forEach(cb => {
          if (cb.onSuccess) cb.onSuccess();
        });
        window.googleMapsCallbacks = [];
        
        // Удаляем временную функцию
        delete window[callbackName];
      };
      
      // Используем loading=async в URL для оптимизации производительности
      // Добавляем библиотеку marker для AdvancedMarkerElement
      script.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyBFHmNf-RhcwfdfBJyqm20eEuQaybgHMgc&libraries=places,marker&loading=async&callback=${callbackName}`;
      
      script.onerror = () => {
        console.error('❌ Ошибка загрузки Google Maps API');
        window.googleMapsLoading = false;
        if (onError) onError('Failed to load Google Maps API');
        window.googleMapsCallbacks.forEach(cb => {
          if (cb.onError) cb.onError('Failed to load Google Maps API');
        });
        window.googleMapsCallbacks = [];
        delete window[callbackName];
      };
      
      document.head.appendChild(script);
    };
    
    // Предзагрузка Google Maps API при загрузке страницы (для ускорения)
    window.addEventListener('DOMContentLoaded', function() {
      // Предзагружаем Google Maps API в фоне для быстрой загрузки карты
      // Используем link preload для оптимизации
      const link = document.createElement('link');
      link.rel = 'preconnect';
      link.href = 'https://maps.googleapis.com';
      document.head.appendChild(link);
      
      const link2 = document.createElement('link');
      link2.rel = 'dns-prefetch';
      link2.href = 'https://maps.googleapis.com';
      document.head.appendChild(link2);
      
      console.log('📄 Предзагрузка DNS для Google Maps API...');
    });
  </script>
